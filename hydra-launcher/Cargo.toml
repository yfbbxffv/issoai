[package]
name = "hydra-launcher"
version = "0.1.0"
edition = "2021"
description = "GameOS Hydra Launcher - Unified gaming frontend for Steam, Ryujinx, yuzu, and more"
authors = ["GameOS Developer"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/seu-usuario/gameos"
readme = "README.md"
keywords = ["gaming", "launcher", "steam", "emulation", "wayland", "gamescope"]
categories = ["games", "gui", "multimedia"]

[workspace]
members = ["hydra-launcher"]

[dependencies]
# Slint UI framework (GPU-accelerated, declarative)
slint = { version = "1.5", features = ["qt6", "wayland", "opengl", "freetype", "system-libc"] }

# Async runtime
tokio = { version = "1.40", features = ["full", "rt-multi-thread"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate"] }
uuid = { version = "1.8", features = ["serde", "v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking", "stream"] }

# File system
walkdir = "2.5"
notify = "6.1"
directories = "5.0"

# Process execution
tokio-process = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
color-eyre = "0.6"

# Platform specific
#[cfg(target_os = "linux")]
libc = "0.2"

#[cfg(target_os = "linux")]
nix = "0.28"

# Steam API
steamworks = "0.12" # opcional, para integração nativa

# Image loading
image = "0.25"
imageproc = "0.25"

# Compression
flate2 = "1.0"
zstd = "0.13"

# Path handling
glob = "0.3"

[build-dependencies]
slint-build = "1.5"

[features]
default = ["system-sqlite"]
system-sqlite = ["sqlx/system-sqlite"]
vendored-sqlite = ["sqlx/vendored-sqlite"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true
split-debuginfo = "packed"